<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <style>
    /* Satu putaran 6 detik: layar dibersihkan, empat tombol diketik, tombol "=" ditekan, hasil muncul, lalu grafik naik turun */
    .layar-ketik, .layar-hasil { transform-box: fill-box; transform-origin: 0 50%; animation: 6s linear infinite; }
    .layar-ketik { animation-name: ketik; }
    .layar-hasil { animation-name: hasil; animation-timing-function: ease-out; }
    .tombol, .tombol-sama { transform-box: fill-box; transform-origin: center; animation: tekan 6s ease-out infinite; }
    .t1 { animation-delay: 0.48s; }
    .t2 { animation-delay: 0.9s; }
    .t3 { animation-delay: 1.32s; }
    .t4 { animation-delay: 1.74s; }
    .tombol-sama { animation-name: tekan-sama; animation-delay: 2.22s; }
    .batang { transform-box: fill-box; transform-origin: 50% 100%; animation: naik-turun 6s ease-in-out infinite; }
    .b2 { animation-delay: 0.15s; }
    .b3 { animation-delay: 0.3s; }
    @keyframes ketik { 0% { transform: scaleX(1); } 4%, 9% { transform: scaleX(0); } 10%, 16% { transform: scaleX(0.25); } 17%, 23% { transform: scaleX(0.5); } 24%, 30% { transform: scaleX(0.75); } 31%, 100% { transform: scaleX(1); } }
    @keyframes hasil { 0% { transform: scaleX(1); } 4%, 39% { transform: scaleX(0); } 47%, 100% { transform: scaleX(1); } }
    @keyframes tekan { 0%, 5%, 100% { fill: #c9d7ff; transform: none; } 2% { fill: #3d66f2; transform: scale(0.84); } }
    @keyframes tekan-sama { 0%, 5%, 100% { fill: #f2a53a; transform: none; } 2% { fill: #d9801b; transform: scale(0.84); } }
    @keyframes naik-turun { 0% { transform: scaleY(1); } 10%, 39% { transform: scaleY(0.3); } 49% { transform: scaleY(1.08); } 57% { transform: scaleY(0.7); } 65% { transform: scaleY(1); } 73% { transform: scaleY(0.8); } 81% { transform: scaleY(1.04); } 89% { transform: scaleY(0.92); } 96%, 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
