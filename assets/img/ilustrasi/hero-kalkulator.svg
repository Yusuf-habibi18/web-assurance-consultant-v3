f2a53a"/><rect x="50" y="224" width="40" height="8" rx="0" fill="#f2a53a"/><ellipse cx="70" cy="224" rx="20" ry="6.8" fill="#ffd28f"/><ellipse cx="70" cy="223.2" rx="20" ry="6.8" fill="#f2a53a"/><rect x="50" y="215.2" width="40" height="8" rx="0" fill="#f2a53a"/><ellipse cx="70" cy="215.2" rx="20" ry="6.8" fill="#ffd28f"/><path d="M60 62Q60 70 68 70Q60 70 60 78Q60 70 52 70Q60 70 60 62Z" fill="#ffd28f"/><path d="M300 40Q300 46 306 46Q300 46 300 52Q300 46 294 46Q300 46 300 40Z" fill="#ffffff"/></svg>
