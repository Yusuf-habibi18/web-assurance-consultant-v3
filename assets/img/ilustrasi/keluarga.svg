<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <style>
    .latar { transform-box: fill-box; transform-origin: center; animation: napas 7s ease-in-out infinite; }
    .hati { transform-box: fill-box; transform-origin: center; animation: denyut 2.6s ease-in-out infinite; }
    .perisai { transform-box: fill-box; transform-origin: center; animation: ambang 4.5s ease-in-out infinite; }
    .anak { animation: lompat 3.2s ease-in-out infinite; }
    .lambai-ayah { transform-box: view-box; transform-origin: 141px 226px; animation: lambai-ayah 2.8s ease-in-out infinite; }
    .lambai-ibu { transform-box: view-box; transform-origin: 373px 228px; animation: lambai-ibu 2.8s ease-in-out -1.4s infinite; }
    @keyframes napas { 50% { transform: scale(1.03); } }
    @keyframes denyut { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(0.98); } 45% { transform: scale(1.08); } }
    @keyframes ambang { 50% { transform: translateY(-9px) rotate(-4deg); } }
    @keyframes lompat { 50% { transform: translateY(-3px); } }
    @keyframes lambai-ayah { 0%, 60%, 100% { transform: rotate(0deg); } 15% { transform: rotate(-12deg); } 30% { transform: rotate(8deg); } 45% { transform: rotate(-9deg); } }
    @keyframes lambai-ibu { 0%, 60%, 100% { transform: rotate(0deg); } 15% { transform: rotate(12deg); } 30% { transform: rotate(-8deg); } 45% { transform: rotate(9deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
