<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <style>
    /* Satu putaran 6 detik: buku oranye lalu buku hijau jatuh menyerong dari kiri atas ke tumpukan (tidak melewati lampu), lampu berkedip hidup-mati lalu menyala, kemudian diulang */
    .buku { transform-box: fill-box; transform-origin: center; animation: 6s linear infinite; }
    .buku-1 { animation-name: tumpuk; }
    .buku-2 { animation-name: jatuh-2; }
    .buku-3 { animation-name: jatuh-3; }
    .bohlam { animation: nyala 6s step-end infinite; }
    .sinar { transform-box: view-box; transform-origin: 270px 66px; animation: sinar 6s ease-out infinite; }
    @keyframes tumpuk { 0%, 13.5%, 17%, 29.5%, 33%, 100% { transform: none; } 15%, 31% { transform: translateY(2px); } }
    @keyframes jatuh-2 {
      0% { opacity: 0; transform: translate(-40px, -140px) rotate(-10deg); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
      5% { opacity: 1; }
      14% { transform: none; animation-timing-function: ease-out; }
      18% { transform: translateY(-9px) rotate(1.5deg); animation-timing-function: ease-in; }
      22%, 30% { transform: none; }
      31.5% { transform: translateY(2px); }
      33%, 88% { opacity: 1; transform: none; animation-timing-function: ease-in; }
      96%, 100% { opacity: 0; transform: translateY(-24px); }
    }
    @keyframes jatuh-3 {
      0%, 16% { opacity: 0; transform: translate(-40px, -160px) rotate(9deg); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
      21% { opacity: 1; }
      30% { transform: none; animation-timing-function: ease-out; }
      34% { transform: translateY(-9px) rotate(-1.5deg); animation-timing-function: ease-in; }
      38%, 88% { opacity: 1; transform: none; animation-timing-function: ease-in; }
      96%, 100% { opacity: 0; transform: translateY(-24px); }
    }
    @keyframes nyala { 0% { fill: #dde5f3; } 39% { fill: #ffd28f; } 45% { fill: #dde5f3; } 50% { fill: #ffd28f; } 54% { fill: #dde5f3; } 58% { fill: #ffd28f; } 92%, 100% { fill: #dde5f3; } }
    @keyframes sinar {
      0%, 38.9% { opacity: 0; transform: scale(0.6); }
      39% { opacity: 1; transform: scale(0.6); }
      41%, 44.9% { opacity: 1; transform: none; }
      45%, 49.9% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(0.6); }
      52%, 53.9% { opacity: 1; transform: none; }
      54%, 57.9% { opacity: 0; transform: scale(0.6); }
      58% { opacity: 1; transform: scale(0.6); }
      60%, 91.9% { opacity: 1; transform: none; }
      92%, 100% { opacity: 0; transform: scale(0.6); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<circle cx="180" cy="140" r="118" fill="#ffffff" fill-opacity="0.07"/><circle cx="270" cy="66" r="56" fill="#ffffff" fill-opacity="0.08"/><path d="M70 71Q70 80 79 80Q70 80 70 89Q70 80 61 80Q70 80 70 71Z" fill="#8fb0ff"/><path d="M320 154Q320 160 326 160Q320 160 320 166Q320 160 314 160Q320 160 320 154Z" fill="#ffffff"/><path d="M150 55Q150 60 155 60Q150 60 150 65Q150 60 145 60Q150 60 150 55Z" fill="#ffd28f"/><g class="buku buku-1"><rect x="92" y="196" width="176" height="30" rx="8" fill="#e0457b"/><rect x="242" y="202" width="20" height="18" rx="4" fill="#ffffff"/><rect x="106" y="208" width="70.4" height="6" rx="3" fill="#ffffff" fill-opacity=".5"/></g><g class="buku buku-2"><rect x="106" y="164" width="156" height="30" rx="8" fill="#f2a53a"/><rect x="236" y="170" width="20" height="18" rx="4" fill="#ffffff"/><rect x="120" y="176" width="62.4" height="6" rx="3" fill="#ffffff" fill-opacity=".5"/></g><g class="buku buku-3"><rect x="86" y="132" width="168" height="30" rx="8" fill="#14a38b"/><rect x="228" y="138" width="20" height="18" rx="4" fill="#ffffff"/><rect x="100" y="144" width="67.2" height="6" rx="3" fill="#ffffff" fill-opacity=".5"/></g><circle class="bohlam" cx="270" cy="66" r="26" fill="#ffd28f"/><rect x="260" y="90" width="20" height="14" rx="4" fill="#c9d7ff"/><rect x="263" y="104" width="14" height="5" rx="2.5" fill="#c9d7ff"/><g class="sinar"><line x1="238" y1="66" x2="230" y2="66" stroke="#ffd28f" stroke-width="4" stroke-linecap="round"/><line x1="302" y1="66" x2="310" y2="66" stroke="#ffd28f" stroke-width="4" stroke-linecap="round"/><line x1="270" y1="34" x2="270" y2="26" stroke="#ffd28f" stroke-width="4" stroke-linecap="round"/><line x1="247.6" y1="43.6" x2="242" y2="38" stroke="#ffd28f" stroke-width="4" stroke-linecap="round"/><line x1="292.4" y1="43.6" x2="298" y2="38" stroke="#ffd28f" stroke-width="4" stroke-linecap="round"/></g></svg>
