<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <style>
    /* Satu putaran 7 detik, mirip ilustrasi Hubungi Kami: gelembung chat muncul "pop" dari ujung ekornya, kartu pesan
       menyusul dari bawah, lalu tanda centang hijau muncul di kalender dan bergoyang (shake) dua kali sambil sedikit membesar,
       supaya tetap terlihat di HP. Gelembung dan kartu membesar-mengecil bergantian. Di akhir, semuanya kecuali kalender
       mengecil hilang dan diulang. Kotak tanggal di bawah centang tertutup penuh saat centang tampil. */
    .gelembung { transform-box: view-box; transform-origin: 60px 148px; animation: muncul-gelembung 7s ease-out infinite; }
    .kartu { transform-box: view-box; transform-origin: 106px 206px; animation: muncul-kartu 7s ease-out infinite; }
    .centang { transform-box: view-box; transform-origin: 258px 152px; animation: centang 7s ease-out infinite; }
    @keyframes muncul-gelembung {
      0% { opacity: 0; transform: scale(0); }
      7% { opacity: 1; transform: scale(1.1); }
      10% { transform: scale(0.96); }
      13%, 54% { opacity: 1; transform: none; }
      58% { transform: scale(1.08); }
      61% { transform: scale(0.97); }
      64%, 88% { opacity: 1; transform: none; }
      95%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes muncul-kartu {
      0%, 9% { opacity: 0; transform: scale(0); }
      16% { opacity: 1; transform: scale(1.1); }
      19% { transform: scale(0.96); }
      22%, 60% { opacity: 1; transform: none; }
      64% { transform: scale(1.08); }
      67% { transform: scale(0.97); }
      70%, 88% { opacity: 1; transform: none; }
      95%, 100% { opacity: 0; transform: scale(0); }
    }
    @keyframes centang {
      0%, 22% { opacity: 0; transform: scale(0); }
      29% { opacity: 1; transform: scale(1.25); }
      32% { transform: scale(0.94); }
      35%, 40% { opacity: 1; transform: none; }
      42% { transform: translateX(-4px) rotate(-18deg) scale(1.25); }
      44% { transform: translateX(4px) rotate(16deg) scale(1.25); }
      46% { transform: translateX(-3px) rotate(-12deg) scale(1.2); }
      48% { transform: translateX(2px) rotate(8deg) scale(1.12); }
      50% { transform: translateX(-1px) rotate(-4deg) scale(1.05); }
      52%, 70% { transform: none; }
      72% { transform: translateX(-4px) rotate(-18deg) scale(1.25); }
      74% { transform: translateX(4px) rotate(16deg) scale(1.25); }
      76% { transform: translateX(-3px) rotate(-12deg) scale(1.2); }
      78% { transform: translateX(2px) rotate(8deg) scale(1.12); }
      80% { transform: translateX(-1px) rotate(-4deg) scale(1.05); }
      82%, 88% { opacity: 1; transform: none; }
      95%, 100% { opacity: 0; transform: scale(0); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
